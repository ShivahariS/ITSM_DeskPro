server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/audit-logs/**
        - id: incident-problem-service
          uri: ${INCIDENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/incidents/**, /api/v1/problems/**, /api/v1/known-errors/**
        - id: change-management-service
          uri: ${CHANGE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/changes/**
        - id: asset-catalog-service
          uri: ${ASSET_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/assets/**, /api/v1/licenses/**, /api/v1/config-items/**, /api/v1/catalog/**, /api/v1/requests/**
        - id: notification-reporting-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/reports/**, /api/reports/**

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
